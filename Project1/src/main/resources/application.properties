# ---- HTTPS (TLS) configuration ----
# Generate the keystore once with:
#   keytool -genkeypair -alias securedb -keyalg RSA -keysize 2048 \
#     -storetype PKCS12 -keystore src/main/resources/keystore.p12 \
#     -validity 3650 -storepass <keystore-password> \
#     -dname "CN=localhost, OU=CIS, O=University of the Cumberlands, L=Williamsburg, ST=KY, C=US"
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
# SYNTHETIC DEMO VALUE for the classroom only. Override with the
# KEYSTORE_PASSWORD environment variable in any real deployment.
server.ssl.key-store-password=${KEYSTORE_PASSWORD:securedb123}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=securedb

# ---- Demo accounts ----
# SYNTHETIC DEMO VALUES for the classroom only, not real secrets.
# Override with environment variables (ADMIN_USERNAME, ADMIN_PASSWORD,
# USER_USERNAME, USER_PASSWORD) in any real deployment.
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:Admin@123}
app.security.user-username=${USER_USERNAME:user}
app.security.user-password=${USER_PASSWORD:User@123}

# ---- Database (H2 in-memory, reachable only through the JPA repository) ----
spring.datasource.url=jdbc:h2:mem:employeedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Keep the H2 console off: no unauthenticated database browser.
spring.h2.console.enabled=false
